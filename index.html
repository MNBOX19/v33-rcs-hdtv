<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>RCS HDTV</title>

<!-- Otimizações de Rede para Internet Lenta -->
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

<!-- Bibliotecas para Web/Mobile (MPEGTS e HLS.js) -->
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>

<style>
/* TEMA VERMELHO E OTIMIZAÇÃO GPU EXTREMA PARA TVS ANTIGAS (SEM SOMBRAS) */
:root {
    --bg-deep: #050505; --bg-panel: #111111;
    --main-color: #FF0000; --main-color-glow: rgba(255, 0, 0, 0.4); 
    --danger-color: #FF3B30; --danger-glow: rgba(255, 59, 48, 0.3);
    --font-xs: 1.8vh; --font-sm: 2.2vh; --font-md: 3vh; --font-lg: 5vh;
}
* { margin:0; padding:0; box-sizing:border-box; outline:none; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
html, body { background:var(--bg-deep); color:#fff; font-family:'Montserrat', sans-serif; width:100%; height:100%; overscroll-behavior:none; overflow: hidden; }
.theme-text { color:var(--main-color); }
#splash-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-deep); z-index:9999999; display:flex; flex-direction:column; align-items:center; justify-content:center; transform: translateZ(0); }
.splash-logo { font-size:13vh; font-weight:900; letter-spacing:2px; text-align:center; }
#splash-msg { color:var(--main-color); margin-top:20px; font-size:var(--font-sm); font-weight:700; letter-spacing:1px; white-space:pre-line; text-align:center; line-height:1.5; }
.hide { display:none!important; }
.flex-center { display:flex; align-items:center; justify-content:center; flex-direction:column; }
.layer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:10; background:var(--bg-deep); overflow:hidden; transform: translateZ(0); }
button, .cat-item, .ep-item, .grid-item, .item, .key, .menu-btn, .menu-card, .menu-power-btn, .power-btn, .smart-card, .toggle-btn { cursor:pointer; }

.focused { border: 3px solid var(--main-color)!important; z-index: 50; will-change: border-color; }
.focused i, .focused .card-title, .focused span { color: var(--main-color)!important; }

#vid-box.focused { border: 3px solid var(--main-color)!important; background: transparent!important; }
#vid-box.fs, #vid-box.fs.focused { border:none!important; width:100vw!important; height:100vh!important; z-index:999999!important; position:fixed!important; top:0!important; left:0!important; background:#000!important; display:block!important; }

/* Estilização Login (Compacta) */
.login-box { width:550px; max-width:90%; max-height:95vh; overflow-y:auto; padding:25px; background:transparent; text-align:center; scrollbar-width: none; }
.login-box::-webkit-scrollbar { display: none; }
.custom-logo-login { transform: rotate(-3deg); margin-bottom: 25px; user-select: none; }
.custom-logo-login .top { font-size: 5vh; font-weight: 900; font-style: italic; color: #FFF; letter-spacing: 2px; }
.custom-logo-login .bottom { font-size: 6.5vh; font-weight: 900; font-style: italic; color: var(--main-color); margin-top: -10px; letter-spacing: 2px; }

.input-group { text-align: left; margin-bottom: 15px; }
.input-group label { display: block; color: var(--main-color); font-size: 13px; font-weight: 900; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.inp { width: 100%; padding: 14px 16px; background: #0a0a0a; border: 1px solid #2a2a2a; color: #fff; text-align: left; font-weight: 700; font-size: 15px; border-radius: 8px; }
.inp::placeholder { color: #555; font-weight: 600; }
.inp.focused { background: #111!important; border-color: var(--main-color)!important; }

.btn { width:100%; padding:14px; margin-top:8px; background: linear-gradient(135deg, #FF0000 0%, #990000 100%); color:#fff; border:3px solid transparent; font-weight:900; font-size:15px; border-radius:8px; text-transform:uppercase; transition: border-color 0.3s, color 0.3s; }
.btn.focused { background:#000!important; color:var(--main-color)!important; border:3px solid var(--main-color)!important; }

.logo-txt { font-size:4vh; font-weight:900; margin-bottom:2vh; text-align:center; }
.menu-top-bar { position:absolute; top:6vh; left:8vw; width:84vw; display:flex; justify-content:space-between; align-items:center; z-index:10; }
.menu-top-left { display:flex; align-items:center; }
.menu-date { font-size:2.6vh; font-weight:600; color:#eee; margin-left:20px; }
.menu-power-btn { width:auto; height:auto; padding:1vh; border:none; background:transparent!important; display:flex; align-items:center; justify-content:center; }
.menu-power-btn i { font-size:4.5vh; color:#fff; }
.menu-power-btn.focused { border:none!important; background:transparent!important; }
.menu-center-wrapper { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }

.smarters-grid { display:flex; width:84vw; height:58vh; }
.smarters-left { flex:0 0 32%; display:flex; margin-right: 2vw; } 
.smarters-right { flex:1; display:flex; flex-direction:column; }
.smarters-right-top { flex:1; display:flex; margin-bottom: 2vh; } 
.smarters-right-top > div:first-child { margin-right: 2vw; } 
.smarters-right-bottom { height:9vh; display:flex; }
.smarters-right-bottom > div:first-child { margin-right: 2vw; }

.menu-card { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border: 3px solid #222; background: linear-gradient(180deg, #181818 0%, #0a0a0a 100%); border-radius: 12px; }
.menu-card .card-icon { font-size:9vh; margin-bottom:1.5vh; color:#888; }
.menu-card .card-title { font-size:3.5vh; font-weight:800; color:#ccc; text-transform:uppercase; letter-spacing: 1px; }

.menu-btn { flex:1; background: linear-gradient(180deg, #222 0%, #111 100%); border:3px solid #333; border-radius:8px; font-weight:800; font-size:2.6vh; color:#ccc; display:flex; align-items:center; justify-content:center; }
.menu-btn i { margin-right:1vw; font-size:3vh; color:#888; }

.menu-footer { position:absolute; bottom:6vh; left:8vw; width:84vw; display:flex; justify-content:space-between; font-size:2.6vh; color:#777; font-weight:700; z-index:10; text-transform:uppercase; }
.info-row { display:flex; justify-content:space-between; padding:1vh 0; border-bottom:1px solid #222; font-size:var(--font-sm); color:#ccc; font-weight: 700; }

.block-panel { border: 2px solid #333; border-radius: 12px; padding: 15px; margin-top: 15px; background: #0a0a0a; text-align: left; }
.block-title { color: var(--danger-color); font-size: 15px; margin-bottom: 12px; font-weight: 900; display:flex; align-items:center; gap:8px; }
.block-grid { display: block; text-align: center; font-size: 0; }
.toggle-item { display: inline-flex; width: 22%; margin: 1%; padding: 10px 5px; box-sizing: border-box; background: #111; border: 2px solid #333; border-radius: 8px; color: #888; font-size: 13px; font-weight: 800; align-items: center; justify-content: center; vertical-align: top; }
.toggle-item i { margin-right: 6px; }
.toggle-item.active { border-color: var(--danger-color); color: #fff; background: rgba(255, 59, 48, 0.15); }
.toggle-item.active i { color: var(--danger-color); }
.toggle-item.focused { border-color: var(--main-color)!important; color: var(--main-color)!important; background: #000; }
.toggle-item.focused i { color: var(--main-color)!important; }

#content-layer { display:flex; width:100%; height:100%; background:var(--bg-deep); overflow:hidden; }
.col-cat { width:25%; background:var(--bg-panel); display:flex; flex-direction:column; border-right:2px solid #222; height:100%; overflow:hidden; transform: translateZ(0); }
.col-list { width:35%; background:#0a0a0a; display:flex; flex-direction:column; border-right:2px solid #222; height:100%; overflow:hidden; transform: translateZ(0); }
.col-play { flex:1; display:flex; flex-direction:column; position:relative; background:transparent; height:100%; overflow:hidden; transform: translateZ(0); }
.mode-grid .col-cat { width:20%; }
.mode-grid .col-list { width:80%; border-right:none; }
.mode-grid .col-play { display:none; }

.cat-head { padding:20px 15px; background: linear-gradient(180deg, #1a1a1a 0%, #111 100%); color:var(--main-color); border-bottom:2px solid #222; text-align:center; font-size:var(--font-md); font-weight:900; flex-shrink:0; }
.cat-top-row { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; }
.cat-title-txt { text-align: center; letter-spacing: 1px; }
.cat-list, .grid-view, .item-list { flex:1; height:100%; overflow-y:auto; overflow-x:hidden; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

.cat-item, .item { padding:18px 20px; color:#999; font-size:var(--font-sm); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:3px solid transparent; border-bottom: 1px solid #1a1a1a; will-change: border-color, background; }
.cat-item.active { background:#1a1a1a; color:#fff; border-left:5px solid var(--main-color); }
.item.playing { color:var(--main-color); background:#1a1a1a; border-left:5px solid var(--main-color); }
.fav-icon { float:right; }

.search-area { padding:15px; background:var(--bg-panel); border-bottom:2px solid #222; flex-shrink:0; }
.inp-search { width:100%; padding:14px; background:#000; border:2px solid #333; color:#fff; font-size:var(--font-sm); font-weight:800; text-transform:uppercase; text-align:center; border-radius: 6px; }
.inp-search.focused { border-color: var(--main-color)!important; }

.grid-view { display:block; padding:25px; text-align:left; font-size:0; }
.grid-item { display:inline-block; vertical-align:top; width:14.66%; margin:0 1% 25px 1%; position:relative; background:#111; border:3px solid transparent; border-radius:8px; overflow:hidden; will-change: border-color; transform: translateZ(0); }
.grid-item-inner { position:relative; width:100%; padding-top:145%; background: linear-gradient(180deg, #1f1f1f 0%, #0a0a0a 100%); }
.grid-item-inner::before { content: "RCS HDTV"; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.5vh; letter-spacing: 2px; color: rgba(255, 255, 255, 0.04); position:absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }
.grid-item img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; background:transparent; z-index:1; }
.grid-item .title-overlay { position:absolute; bottom:0; left:0; width:100%; background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 50%, transparent 100%); padding:30px 10px 10px 10px; color:#fff; font-size:1.6vh; font-weight:800; text-align:center; white-space:normal; line-height:1.3; word-wrap:break-word; z-index:5; }
.fav-badge { position:absolute; top:10px; right:10px; z-index:10; color:var(--main-color); font-size:3.5vh; }

.vid-box { width:100%; height:50vh; background:#000; position:relative; border-bottom:2px solid #222; overflow:hidden; flex-shrink:0; }
#player-container { width:100%; height:100%; background:#000; }
video { width:100%; height:100%; object-fit:fill; background:#000; z-index:1; }
.buffer-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:#050505; z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; }
.buffer-spinner { font-size:8vh; color:var(--main-color); }
#pause-layer { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:transparent; z-index:9000; align-items:center; justify-content:center; pointer-events:none; }
#pause-layer i { font-size:18vh; color:#FFF!important; }

.meta { padding:30px; flex:1; height:100%; overflow-y:auto; background:var(--bg-panel); display:flex; flex-direction:column; }
.meta-title { font-size:var(--font-lg); color:#fff; font-weight:900; margin-bottom:1vh; line-height: 1.1; text-transform: uppercase; }
.meta-desc { font-size:var(--font-sm); color:#888; margin-bottom:1vh; font-weight: 600; white-space: normal; word-wrap: break-word; }
.keys { display:flex; justify-content:space-between; align-items:center; padding-top:2.5vh; border-top:2px solid #222; margin-top:auto; flex-shrink:0; }
.key { flex:1; margin:0 .5vw; font-size:var(--font-xs); color:#ccc; font-weight:800; background:#000; border:2px solid #333; padding:1.5vh .5vw; border-radius: 6px; display:flex; align-items:center; justify-content:center; white-space:nowrap; }
.key:first-child { margin-left:0; }
.key:last-child { margin-right:0; }
.dot { width:1.2vh; height:1.2vh; flex-shrink:0; margin-right:1.2vw; border-radius:50%; background-color: currentColor; }

#episodes-layer { background:rgba(0,0,0,0.9); z-index:99999; }
.ep-modal { width:80%; height:80%; background:var(--bg-deep); border:3px solid #333; border-radius: 16px; display:flex; flex-direction:column; overflow:hidden; }
.ep-header { padding:25px; text-align:center; font-size:3.5vh; font-weight:900; background: linear-gradient(180deg, #1a1a1a 0%, #111 100%); color:var(--main-color); border-bottom:2px solid #222; letter-spacing: 1px; }
.ep-body { display:flex; flex:1; overflow:hidden; }
.ep-seasons { width:30%; border-right:2px solid #222; overflow-y:auto; background:#0a0a0a; }
.ep-episodes { flex:1; overflow-y:auto; background:var(--bg-panel); }
.ep-item { padding:20px; border-bottom:1px solid #222; font-size:2.2vh; font-weight:700; color:#888; border-left: 5px solid transparent; border-top: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 3px solid transparent; }
.ep-item.active-season { border-left-color: var(--main-color); background: #1a1a1a; color: #fff; }
.ep-item.focused { border: 3px solid var(--main-color)!important; background: #000!important; color: var(--main-color)!important; }

.profiles-container { display:flex; justify-content:center; flex-wrap:wrap; max-width:80vw; }
.profile-card { width:14vw; height:14vw; margin: 1vw; background:linear-gradient(180deg, #181818 0%, #0a0a0a 100%); border:3px solid #222; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.profile-card i { font-size:6vh; color:#888; margin-bottom:1.5vh; }
.profile-name { font-size:2.2vh; font-weight:800; color:#ccc; }

::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#444; border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--main-color); }
</style>
</head>
<body onload="App.init()">
<audio id="n-audio" src="" preload="auto"></audio>
<div id="splash-screen">
    <div class="splash-logo"><span><span style="color:#fff">RCS</span> <span class="theme-text">HDTV</span></span></div>
    <div id="splash-msg"></div>
</div>
<div id="profiles-layer" class="layer flex-center hide">
    <div class="logo-txt" style="margin-bottom:5vh;font-size:5vh"><span class="theme-text">QUEM ESTÁ ASSISTINDO?</span></div>
    <div id="profiles-list" class="profiles-container"></div>
</div>
<div id="profile-modal" class="layer flex-center hide" style="background:rgba(5,5,5,0.95);z-index:9999999">
    <div class="login-box" style="background:var(--bg-panel); border:1px solid #222; border-radius: 12px;">
        <div id="pm-name" class="theme-text" style="font-size:3.5vh;margin-bottom:2.5vh;font-weight:900;text-transform:uppercase"></div>
        <button id="pm0" class="btn focusable" onclick="App.profileAction('enter')">ENTRAR NA CONTA</button> 
        <button id="pm1" class="btn focusable" style="background: linear-gradient(135deg, #333 0%, #111 100%); color:#fff; border-color:#444;" onclick="App.profileAction('delete')">EXCLUIR PERFIL</button> 
        <button id="pm2" class="btn focusable" style="background: transparent; color:#888; border-color:#333;" onclick="App.profileAction('cancel')">CANCELAR</button>
    </div>
</div>

<div id="login-layer" class="layer flex-center hide">
    <div class="login-box">
        <div class="custom-logo-login">
            <div class="top">RCS</div>
            <div class="bottom">HDTV</div>
        </div>
        
        <div class="input-group">
            <label>DNS / URL DO SERVIDOR</label>
            <input type="text" id="i0" class="inp focusable" placeholder="http://servidor.com:80" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label>USUÁRIO</label>
            <input type="text" id="i1" class="inp focusable" placeholder="Seu usuário" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label>SENHA</label>
            <input type="password" id="i2" class="inp focusable" placeholder="Sua senha" autocomplete="off">
        </div>
        
        <button id="i3" class="btn focusable" onclick="App.loginManual()">ENTRAR AGORA</button>
        <div id="msg-login" style="color:var(--main-color);margin-top:15px;font-size:var(--font-sm);font-weight:800"></div>
        <button id="i4" class="btn focusable hide" style="background:transparent; border-color:#333; color:#888; margin-top:8px;" onclick="App.showProfiles()">VOLTAR</button>
    </div>
</div>

<div id="menu-layer" class="layer hide">
    <div class="menu-top-bar">
        <div class="menu-top-left">
            <div class="logo-txt" style="margin:0;font-size:3.5vh"><span><span style="color:#fff">RCS</span> <span class="theme-text">HDTV</span></span></div>
            <div id="menu-date" class="menu-date">--:--</div>
        </div>
        <div id="m3" class="menu-power-btn focusable" onclick="App.totalReset()"><i class="fas fa-power-off"></i></div>
    </div>
    <div class="menu-center-wrapper">
        <div class="smarters-grid">
            <div class="smarters-left">
                <div id="m0" class="menu-card focusable" onclick="App.openMode('live')"><i class="fas fa-tv card-icon"></i><div class="card-title">TV AO VIVO</div></div>
            </div>
            <div class="smarters-right">
                <div class="smarters-right-top">
                    <div id="m1" class="menu-card focusable" onclick="App.openMode('vod')"><i class="fas fa-play-circle card-icon"></i><div class="card-title">FILMES</div></div>
                    <div id="m2" class="menu-card focusable" onclick="App.openMode('series')"><i class="fas fa-clapperboard card-icon"></i><div class="card-title">SÉRIES</div></div>
                </div>
                <div class="smarters-right-bottom">
                    <div id="m4" class="menu-btn focusable" onclick="App.openSettings()" style="flex:1"><i class="fas fa-user-shield"></i> MINHA CONTA</div><div style="flex:1"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="menu-footer">
        <div id="menu-exp">Expiração: ...</div><div id="menu-user">Usuário: ...</div>
    </div>
</div>
<div id="content-layer" class="layer hide">
    <div class="col-cat">
        <div class="cat-head">
            <div class="cat-top-row">
                <i class="fas fa-arrow-left" style="font-size:2.5vh; position:absolute; left:0; cursor:pointer; padding:5px; color:#888;" onclick="App.back(true)" onmouseover="this.style.color='var(--main-color)'" onmouseout="this.style.color='#888'"></i>
                <div id="cat-title-txt" class="cat-title-txt">MENU</div>
            </div>
            <div id="item-count" style="font-size:.7em;margin-top:5px;opacity:.7;color:#888;">...</div>
        </div>
        <div id="cat-list" class="cat-list"></div>
    </div>
    <div class="col-list">
        <div class="search-area"><input type="text" id="search" class="inp-search focusable" placeholder="BUSCAR NA CATEGORIA" autocomplete="off"></div>
        <div id="item-list" class="item-list"></div>
        <div id="grid-list" class="grid-view hide"></div>
    </div>
    <div class="col-play">
        <div id="vid-box" class="vid-box focusable" onclick="App.handleVideoTap(event)">
            <div id="player-container"><video id="player" playsinline webkit-playsinline></video></div>
            <div id="smart-buffer" class="buffer-overlay"><i class="fas fa-circle-notch fa-spin buffer-spinner"></i></div>
            <div id="pause-layer"><i class="fas fa-pause"></i></div>
        </div>
        <div class="meta">
            <div id="meta-title" class="meta-title">...</div>
            <div id="meta-desc" class="meta-desc"></div>
            <div class="keys">
                <div class="key" id="key-fs"><div class="dot" style="color:red;"></div> TELA CHEIA</div>
                <div class="key" id="key-top"><div class="dot" style="color:#00c851;"></div> TOPO</div>
                <div class="key" id="key-search"><div class="dot" style="color:#FFC107;"></div> BUSCAR</div>
                <div class="key" id="key-menu" onclick="App.openSettings()" style="cursor:pointer;"><div class="dot" style="color:#33b5e5;"></div> CONFIG.</div>
            </div>
        </div>
    </div>
</div>

<div id="episodes-layer" class="layer flex-center hide">
    <div class="ep-modal">
        <div class="ep-header" style="position:relative;">
            <i class="fas fa-arrow-left" style="font-size:3vh; position:absolute; left:20px; top:50%; transform:translateY(-50%); cursor:pointer; color:#888;" onclick="App.back(true)" onmouseover="this.style.color='var(--main-color)'" onmouseout="this.style.color='#888'"></i>
            <span id="ep-title">SÉRIE</span>
        </div>
        <div class="ep-body">
            <div class="ep-seasons" id="season-list"></div>
            <div class="ep-episodes" id="ep-list"></div>
        </div>
    </div>
</div>

<div id="settings-layer" class="layer hide flex-center">

<script>

var PlayerEngine={video:null,url:null,monitorTimer:null,lastTime:0,stallCount:0,retryCount:0,isBuffering:false,maxRetries:999999,
hlsInst:null,mpegtsInst:null,
init:function(){this.bindVideo()},
bindVideo:function(){this.video=document.getElementById('player');if(!this.video)return;this.video.onerror=function(){PlayerEngine.handleError(false)};this.video.onabort=function(){PlayerEngine.handleError(false)};this.video.onstalled=function(){PlayerEngine.showBuffer()};this.video.onended=function(){if(App.currentMode==='series'){App.playNextEpisode()}else if(App.currentMode==='vod'){App.exitFull()}else{PlayerEngine.handleError(false)}};this.video.addEventListener('playing',function(){PlayerEngine.onPlaySuccess()});this.video.addEventListener('waiting',function(){PlayerEngine.showBuffer()});this.video.controls=false},
destroyLibs:function(){
    if(this.hlsInst){this.hlsInst.destroy();this.hlsInst=null;}
    if(this.mpegtsInst){this.mpegtsInst.destroy();this.mpegtsInst=null;}
},
resetDOM:function(){this.destroyLibs();if(this.video){try{this.video.pause()}catch(e){}this.video.removeAttribute('src');try{this.video.load()}catch(e){}}},
play:function(url){
    if(!url)return;
    if(this.url===url&&!this.video.error){if(this.video.paused)safePlay(this.video);return}
    if(this.url&&this.url!==url){this.hardStop();this.resetDOM()}
    this.url=url;this.stallCount=0;this.retryCount=0;this.showBuffer();
    document.getElementById('pause-layer').style.display='none';
    
    if(this.video){
        this.destroyLibs();
        var f = App.cfg.filters;
        try {
            if(f.hlsjs && typeof Hls !== 'undefined' && Hls.isSupported() && url.indexOf('.m3u8') > -1) {
                this.hlsInst = new Hls();
                this.hlsInst.loadSource(url);
                this.hlsInst.attachMedia(this.video);
                this.hlsInst.on(Hls.Events.MANIFEST_PARSED, function() { safePlay(PlayerEngine.video); });
                this.hlsInst.on(Hls.Events.ERROR, function(e, data) { if(data.fatal) PlayerEngine.handleError(false); });
            } else if (f.mpegts && typeof mpegts !== 'undefined' && mpegts.isSupported() && url.indexOf('.ts') > -1) {
                this.mpegtsInst = mpegts.createPlayer({ type: 'mse', isLive: App.currentMode==='live', url: url });
                this.mpegtsInst.attachMediaElement(this.video);
                this.mpegtsInst.load();
                safePlay(this.video);
                this.mpegtsInst.on(mpegts.Events.ERROR, function() { PlayerEngine.handleError(false); });
            } else {
                this.video.src=url;
                try{this.video.load()}catch(e){}
                safePlay(this.video);
            }
        } catch(ex) {
            this.video.src=url;
            try{this.video.load()}catch(e){}
            safePlay(this.video);
        }
    }
    this.startMonitor()
},

loginManual:function(){var rawH=document.getElementById('i0').value.trim();var u=document.getElementById('i1').value.trim();var p=document.getElementById('i2').value.trim();var msg2=document.getElementById('msg-login');if(!rawH||!u||!p){if(msg2)msg2.innerText="PREENCHA TODOS OS CAMPOS!";return}this.login(false,true)},
login:function(isAuto,isNewLogin){var rawH=document.getElementById('i0').value.trim();var u=document.getElementById('i1').value.trim();var p=document.getElementById('i2').value.trim();var h=rawH;if(h.endsWith('/'))h=h.slice(0,-1);if(!/^https?:\/\//i.test(h))h='http://'+h;var uParts=h.split('/');if(uParts.length>=3&&uParts[2].indexOf(':')===-1){uParts[2]+=':80'}h=uParts.join('/');if(!isAuto){App.showSplash();requestNativeFullscreen(document.documentElement)}var msg1=document.getElementById('splash-msg');var msg2=document.getElementById('msg-login');if(msg1)msg1.innerText="A INICIAR SESSÃO...";if(msg2)msg2.innerText="A INICIAR SESSÃO...";App.loginReq=this.req(h+"/player_api.php?username="+u+"&password="+p,function(d){if(d==='ERR_NET'){App.hideSplash();App.setScr(0);if(msg2)msg2.innerHTML=App.i18n[App.cfg.lang].err_net;return}if(d&&d.user_info&&d.user_info.auth==1){App.creds={h:h,u:u,p:p};DB.name='nr_db_'+u;var exists=false;for(var i=0;i<App.profiles.length;i++){if(App.profiles[i].u===u)exists=true}if(!exists){App.profiles.push({u:u,p:p,h:rawH});localStorage.setItem('nr_profiles',JSON.stringify(App.profiles))}App.userInfo=d.user_info;var info=d.user_info;var exp=info.exp_date?new Date(info.exp_date*1000).toLocaleDateString('pt-BR'):App.i18n[App.cfg.lang].unlimited;document.getElementById('set-user').innerText=info.username||u;document.getElementById('set-exp').innerText=exp;document.getElementById('set-conn').innerText=(info.active_cons||0)+" / "+(info.max_connections||1);document.getElementById('menu-exp').innerHTML="Expiração: "+exp;document.getElementById('menu-user').innerHTML="Usuário: "+(info.username||u);if(isNewLogin){DB.wipe(function(){App.syncData(function(){App.hideSplash();App.setScr(1)})})}else{App.getParsed('live_cat',function(cached){if(cached&&cached.length>0){App.hideSplash();App.setScr(1)}else{App.syncData(function(){App.hideSplash();App.setScr(1)})}})}}else{App.hideSplash();App.setScr(0);if(msg2)msg2.innerText=App.i18n[App.cfg.lang].err_auth}},45000)},
toggleCfg:function(key){

    localStorage.setItem('rc_cfg_filters_v2', JSON.stringify(this.cfg.filters));
    this.updateCfgUI();
},
setPlayerMode:function(mode){
    this.cfg.filters.ts = (mode === 'ts');
    this.cfg.filters.hls = (mode === 'hls');
    this.cfg.filters.mpegts = (mode === 'mpegts');
    this.cfg.filters.hlsjs = (mode === 'hlsjs');
    localStorage.setItem('rc_cfg_filters_v2', JSON.stringify(this.cfg.filters));
    this.updateCfgUI();
},
updateCfgUI:function(){
    var f = this.cfg.filters;
    var keys = ['adult','h24','k4','uhd','h265','h264','fhd','hd','sd','leg'];
    for(var i=0; i<keys.length; i++){
        var el = document.getElementById('s'+(i+1));
        if(el){
            if(f[keys[i]]){
                el.classList.add('active');
                el.innerHTML = '<i class="far fa-check-square"></i> ' + el.innerText.trim();
            } else {
                el.classList.remove('active');
                el.innerHTML = '<i class="far fa-square"></i> ' + el.innerText.trim();
            }
        }
    }
    
    var baseStyle = "margin-top:0; width: 48%; background:transparent; transition: border-color 0.3s, color 0.3s; ";
    var modes = ['ts', 'hls', 'mpegts', 'hlsjs'];
    var btnIds = ['s11', 's12', 's13', 's14'];
    var btnLabels = ['TS NATIVO (TV)', 'HLS NATIVO (TV)', 'MPEGTS.JS (WEB)', 'HLS.JS (WEB)'];
    
    for(var j=0; j<4; j++){
        var elBtn = document.getElementById(btnIds[j]);
        if(elBtn){
            if(f[modes[j]]) {
                elBtn.style.cssText = baseStyle + "border: 3px solid var(--main-color); color:var(--main-color);";
                elBtn.innerHTML = "<i class='fas fa-dot-circle'></i> " + btnLabels[j];
            } else {
                elBtn.style.cssText = baseStyle + "border: 3px solid #333; color:#888;";
                elBtn.innerHTML = "<i class='far fa-circle'></i> " + btnLabels[j];
            }
        }
    }
},
isBlocked:function(name){
    var f = this.cfg.filters;
    if(!f.adult && !f.h24 && !f.k4 && !f.uhd && !f.h265 && !f.h264 && !f.fhd && !f.hd && !f.sd && !f.leg) return false;
    var n = (name || "").toLowerCase();
    
    if(f.adult && (/adulto|xxx|sex|porn|\+18|teste|expirado/i.test(n))) return true;
    if(f.h24 && (/24h|24 hrs|24 horas/i.test(n))) return true;
    if(f.k4 && (/4k/i.test(n))) return true;
    if(f.uhd && (/uhd|2160p/i.test(n))) return true;
    if(f.h265 && (/h265|hevc|h\.265/i.test(n))) return true;
    if(f.h264 && (/h264|avc|h\.264/i.test(n))) return true;
    if(f.fhd && (/fhd|1080p|1080|full\s*hd/i.test(n))) return true;
    if(f.leg && (/legendado|leg/i.test(n))) return true;
    
    if(f.hd || f.sd){
        var c = n.replace(/fhd|uhd|full\s*hd|1080p|1080/g, '');
        if(f.hd && (/hd|720p|720/i.test(c))) return true;
        if(f.sd && (/(^|[^a-z])sd([^a-z]|$)|480p|480/i.test(c))) return true;
    }
    return false;
},
req:function(url,cb,customTimeout,asRaw){var x=new XMLHttpRequest();var cB=(url.indexOf('?')>-1?'&':'?')+'_t='+new Date().getTime();x.open("GET",url+cB,true);x.timeout=customTimeout||30000;x.onload=function(){if(x.status===200){if(asRaw){cb(x.responseText)}else{try{cb(JSON.parse(x.responseText))}catch(e){cb(null)}}}else{cb(null)}x=null};x.onerror=function(){cb('ERR_NET');x=null};x.ontimeout=function(){cb('ERR_NET');x=null};x.send();return x},

fetchEPG: function(sId){
    var mD=document.getElementById('meta-desc');
    mD.innerHTML="Carregando EPG... <i class='fas fa-circle-notch fa-spin'></i>";
    this.req(this.creds.h+"/player_api.php?username="+this.creds.u+"&password="+this.creds.p+"&action=get_short_epg&stream_id="+sId,function(d){
        if(d&&d.epg_listings&&d.epg_listings.length>0){
            var now=d.epg_listings[0];
            var next=d.epg_listings.length>1?d.epg_listings[1]:null;
            
            var dec=function(s){
                if(!s) return "";
                try {
                    return decodeURIComponent(atob(s).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                } catch(e) {
                    try { return decodeURIComponent(escape(atob(s))); } 
                    catch(e2) { return atob(s).replace(/[^\x20-\x7E\u00A0-\u00FF\u0100-\u017F]/g, ""); } 
                }
            };
            
            var tNow=now.title?dec(now.title):"Programa atual";
            var tNext=next&&next.title?dec(next.title):"Sem informação";
            
            mD.innerHTML="<div style='margin-bottom:8px;font-size:1.1em; white-space:normal; word-wrap:break-word;'><strong style='color:var(--main-color)'>AGORA:</strong> "+tNow+"</div><div style='white-space:normal; word-wrap:break-word;'><strong style='color:#888'>A SEGUIR:</strong> "+tNext+"</div>";
        }else{
            mD.innerHTML="EPG Indisponível";
        }
    },15000,false);
},
playStream:function(it){
    var id=it.stream_id;
    var u="";
    if(this.currentMode==='live'){
        if(this.playingId==id){this.toggleFull();return}
        
        var ext = ".ts";
        if(this.cfg.filters.hls || this.cfg.filters.hlsjs) {
            ext = ".m3u8";
        }
        
        u=this.creds.h+"/live/"+this.creds.u+"/"+this.creds.p+"/"+id+ext;
        this.playingId=id;
        document.getElementById('meta-title').innerText=it.name||it.title;
        document.getElementById('meta-desc').innerText="";
        this.fetchEPG(id);
        PlayerEngine.play(u);
        requestNativeFullscreen();
        
        var its=document.querySelectorAll('.item');
        for(var k=0;k<its.length;k++){its[k].classList.remove('playing')}
        var r=document.getElementById('row-'+this.idx);
        if(r)r.classList.add('playing')
    }else if(this.currentMode==='vod'){
        document.getElementById('content-layer').classList.remove('mode-grid');
        u=this.creds.h+"/movie/"+this.creds.u+"/"+this.creds.p+"/"+id+".mp4";
        this.playingId=id;
        document.getElementById('meta-title').innerText=it.name||it.title;
        var b=document.getElementById('vid-box');
        b.style.display='block';
        b.classList.add('fs');
        PlayerEngine.play(u);
        requestNativeFullscreen(b);
        this.zone=3;
        this.updateFocus()
    }
},

removeAccents:function(s){if(!s)return"";var r=s.toLowerCase();r=r.replace(/[áàãâä]/g,'a');r=r.replace(/[éèêë]/g,'e');r=r.replace(/[íìîï]/g,'i');r=r.replace(/[óòõôö]/g,'o');r=r.replace(/[úùûü]/g,'u');r=r.replace(/[ç]/g,'c');return r},

doSearch:function(isG){
    var rT=document.getElementById('search').value;
    if(rT.length===0){
        if(this.lastCatIdx>-1){
            this.loadContent(this.lastCatIdx)
        }else{
            document.getElementById('item-list').innerHTML='<div style="padding:20px;text-align:center">&larr; SELECIONE UMA CATEGORIA</div>';
            document.getElementById('grid-list').innerHTML='<div style="padding:20px;text-align:center;width:100%">&larr; SELECIONE UMA CATEGORIA</div>';
            this.fullData=[];
            this.renderList();
        }
        return
    }
    if(rT.length<2)return;
    var tS=App.removeAccents(rT);
    var searchTerms = tS.split(" "); 
    this.renderedCount=0;
    
    if(isG){
        var ld='<div style="padding:20px;text-align:center;color:var(--main-color);font-size:2vh"><i class="fas fa-circle-notch fa-spin" style="font-size:5vh;margin-bottom:15px"></i><br><br>BUSCANDO NO SERVIDOR...</div>';
        document.getElementById('item-list').innerHTML=ld;
        document.getElementById('grid-list').innerHTML=ld;
        var aS=this.currentMode==='live'?'get_live_streams':(this.currentMode==='vod'?'get_vod_streams':'get_series');
        
        App.req(App.creds.h+"/player_api.php?username="+App.creds.u+"&password="+App.creds.p+"&action="+aS,function(d){
            if(d&&d!=='ERR_NET'){
                var r=[];
                var mR=200; 
                for(var i=0;i<d.length;i++){
                    var n=d[i].name||d[i].title||"";
                    var cleanN = App.removeAccents(n);
                    var match = true;
                    
                    for(var t=0; t<searchTerms.length; t++){
                        if(cleanN.indexOf(searchTerms[t]) === -1) { match = false; break; }
                    }
                    
                    if(match && !App.isBlocked(n)){
                        r.push(d[i]);
                        if(r.length>=mR)break
                    }
                }
                if(r.length>0){
                    r.sort(App.smartSort);
                    if (r.length > 1500) { r = r.slice(0, 1500); }
                    App.fullData=r;
                    App.zone=2;
                    App.idx=0;
                    App.renderList();
                    App.updateTotalCountUI(r.length,false)
                }else{
                    var ep='<div style="padding:20px;text-align:center">Nenhum resultado.</div>';
                    document.getElementById('item-list').innerHTML=ep;
                    document.getElementById('grid-list').innerHTML=ep;
                    App.updateTotalCountUI(0,false)
                }
            }else{
                document.getElementById('item-list').innerHTML='<div style="padding:20px;text-align:center">Erro de conexão.</div>';
                document.getElementById('grid-list').innerHTML='<div style="padding:20px;text-align:center">Erro de conexão.</div>';
            }
        },30000,false)
    }else{
        setTimeout(function(){
            var bD=App.categoryDataCache||App.fullData;
            if(!bD||bD.length===0)return;
            var r=[];
            for(var i=0;i<bD.length;i++){
                var n=bD[i].name||bD[i].title||"";
                var cleanN = App.removeAccents(n);
                var match = true;
                for(var t=0; t<searchTerms.length; t++){
                    if(cleanN.indexOf(searchTerms[t]) === -1) { match = false; break; }
                }
                if(match){
                    r.push(bD[i])
                }
            }
            if(r.length>0){
                App.fullData=r;
                App.renderList();
                App.updateTotalCountUI(r.length,false)
            }else{
                document.getElementById('item-list').innerHTML='<div style="padding:20px;text-align:center">Não encontrado.<br><br>ENTER PARA GLOBAL</div>';
                document.getElementById('grid-list').innerHTML='<div style="padding:20px;text-align:center">Não encontrado.<br><br>ENTER PARA GLOBAL</div>';
                App.updateTotalCountUI(0,false)
            }
        },50)
    }
},

showFeedback: function(iconClass) {
    var isFullscreen = document.getElementById('vid-box').classList.contains('fs');
    if (isFullscreen && (iconClass.indexOf('fa-forward') > -1 || iconClass.indexOf('fa-backward') > -1)) { return; }
    var el = document.getElementById('pause-layer');
    el.innerHTML = '<i class="' + iconClass + '" style="font-size:18vh; color:#FFF!important;"></i>';
    el.style.display = 'flex';
    if (this.feedbackTimer) clearTimeout(this.feedbackTimer);
    if (iconClass.indexOf('fa-pause') === -1) { this.feedbackTimer = setTimeout(function() { el.style.display = 'none'; }, 500); }
},

    var tD = n - (this.lastTap || 0);
    this.lastTap = n;

    if(this.currentMode === 'live') {
        if(tD < 300 && tD > 0){
            clearTimeout(this.tapTimer);
            this.toggleFull();
        } else {
            this.tapTimer = setTimeout(function(){ App.toggleFull(); }, 300);
        }
        return;
    }

    var rect = e.currentTarget.getBoundingClientRect();
    var clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    var x = clientX - rect.left;
    var width = rect.width;

    if (x < width * 0.3) {
        this.seekVideo(-30);
    } else if (x > width * 0.7) {
        this.seekVideo(30);
    } else {
        if (tD < 300 && tD > 0) {
            clearTimeout(this.tapTimer);
            this.toggleFull();
        } else {
            this.tapTimer = setTimeout(function(){ App.togglePlayPause(); }, 300);
        }
